name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies (no Hermes runtime required)
        run: python3 -m pip install 'numpy>=1.26,<3' 'Pillow>=10,<13' 'PyYAML>=6,<7' 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - name: Public tree guard
        run: python3 tools/check_public.py
      - name: Public history guard
        run: python3 tools/check_public.py --history
      - name: Game backtest (must print PASS)
        run: node tools/backtest.js
      - name: Extractor redaction and synthetic API privacy corpus (no Hermes required)
        run: |
          python3 -m unittest discover -s tools -p 'test_extract.py' -v
          python3 -m unittest discover -s dashboard -p 'test_live_contract.py' -v
      - name: Cursor capacity regression (synthetic thousands of sessions)
        run: python3 tools/test_cursor.py -v
      - name: Post-deploy gate regression (fake host and rollback)
        run: python3 tools/test_post_deploy_check.py -v
      - name: Other tools unit tests (synthetic fixtures)
        run: |
          for test in tools/test_*.py; do
            # These suites already ran in their dedicated steps above.
            case "$test" in
              tools/test_extract.py|tools/test_cursor.py|tools/test_post_deploy_check.py) continue ;;
            esac
            python3 -m unittest discover -s tools -p "${test##*/}" -v
          done
      - name: Other dashboard API unit tests (synthetic databases)
        run: |
          for test in dashboard/test_*.py; do
            [ "$test" = dashboard/test_live_contract.py ] && continue
            python3 -m unittest discover -s dashboard -p "${test##*/}" -v
          done
      - name: Node regression tests
        run: |
          node --test tools/test_mobile_measurement.cjs
          node tools/backtest.test.js
          node dashboard/test_game.cjs
          node dashboard/test_defaults.cjs
          # test_api_migration.cjs receives real synthetic API fixtures from
          # test_live_contract.py in the redaction/privacy step above.
      - name: Live-host checks intentionally skipped
        run: |
          printf '%s\n' 'SKIP: live dashboard authentication, installed Hermes plugin, and network/browser deployment checks require an operator host; all repository unit tests run above using synthetic fixtures.'

  ui-regressions:
    name: UI inventory and mobile (Chromium + Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Mobile smoke compares paired screenshots with the public baseline.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Playwright and both browsers
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox
      - name: UI inventory (both engines, portrait/landscape, zoom 1 and 3)
        run: node tools/test_ui_inventory.cjs "$RUNNER_TEMP/ui-regressions/inventory"
      - name: Selected rendering and private presentation (both engines)
        run: node tools/test_scene_selection.cjs "$RUNNER_TEMP/ui-regressions/selection"
      - name: Native scene + hero interaction (region tap vs main, overflow/chooser identity, occlusion; both engines)
        run: node tools/test_scene_hero_interaction.cjs "$RUNNER_TEMP/ui-regressions/scene-hero"
      - name: Mobile smoke (Chromium, 8 viewports x 3 zooms)
        run: node tools/test_ui_mobile.cjs "$RUNNER_TEMP/ui-regressions/mobile-chromium" smoke
      - name: Mobile smoke (Firefox, same unchanged assertions)
        env:
          QUEST_MOBILE_OUT: ${{ runner.temp }}/ui-regressions/mobile-firefox
        run: |
          # The test imports chromium directly. Select Firefox at the launcher
          # boundary only; smoke uses no CDP, and no assertions are replaced.
          node -e '
            const pw = require("playwright");
            pw.chromium = pw.firefox;
            process.argv = [process.execPath, "tools/test_ui_mobile.cjs", process.env.QUEST_MOBILE_OUT, "smoke"];
            require("./tools/test_ui_mobile.cjs");
          '
      - name: Print actual UI case counts (reject empty reports)
        env:
          QUEST_UI_OUT: ${{ runner.temp }}/ui-regressions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const read = file => JSON.parse(fs.readFileSync(path.join(process.env.QUEST_UI_OUT, file)));
          const inventory = read('inventory/inventory-report.json');
          for (const engine of ['chromium', 'firefox']) {
            const cases = inventory.records.filter(record => record.engine === engine);
            assert(cases.length > 0, `inventory ${engine} must run cases`);
            console.log(`PASS inventory ${engine}: ${cases.length} cases; browser ${cases[0].browser}`);
            const mobile = read(`mobile-${engine}/smoke-report.json`);
            assert(mobile.records.length > 0, `mobile ${engine} must run cases`);
            console.log(`PASS mobile ${engine}: ${mobile.records.length} cases; browser ${mobile.browser}`);
          }
          NODE
      - name: Upload UI regression evidence (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-evidence
          path: ${{ runner.temp }}/ui-regressions
          if-no-files-found: warn
          retention-days: 7

  browsers:
    name: browser smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Playwright (devDependency only)
        run: npm ci --no-audit --no-fund
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache browser binaries
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - name: Install browser and system dependencies
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install system dependencies only (browser cached)
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Browser smoke (1280x800 and 390x844; demo from tools/mock.py)
        run: node tools/browser_smoke.mjs ${{ matrix.browser }} --out "$RUNNER_TEMP/smoke-shots"
      - name: Upload screenshots (CI artifact only, never committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ matrix.browser }}
          path: ${{ runner.temp }}/smoke-shots
          if-no-files-found: warn
          retention-days: 7
