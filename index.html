<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Quest</title>
<link rel="icon" href="data:,">
<style>
:root{--ink:#e8dfc6;--gold:#d9b25c;--navy:#0d1526;--panel:#111b30ee;--line:#3a4a6b;--red:#e0503c;--green:#58c27a;--blue:#4aa3ff;--hud-height:56px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05080f;color:var(--ink);font:13px/1.35 "Noto Sans Thai",system-ui,sans-serif;overflow:hidden}
#stage,#ui-stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
#ui-stage{pointer-events:none}
#hud{z-index:2}#tag,#help{z-index:2}#camp,#chron{z-index:3}#quest{z-index:4}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:pre-wrap;border:0}
button{width:44px;height:44px;min-width:44px;min-height:44px;padding:2px;background:#1b2742;border:1px solid var(--line);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
button.on,button:focus-visible{outline:2px solid var(--gold)}
canvas{image-rendering:pixelated;display:block;flex:none}
#hud{height:56px!important;flex-wrap:nowrap!important;gap:4px!important;padding:5px!important;bottom:0!important;left:0!important;right:0!important;border-radius:0}
#hud button{padding:2px!important;min-height:44px}
#speeds{width:60px!important;min-width:60px}
#clock{width:60px;min-width:60px!important;display:flex;justify-content:center}
#scrub{min-width:44px!important;min-height:24px;flex:1}
#tabs{display:flex!important;gap:4px}
#mana{gap:4px!important;flex:none}
#mana>div{width:68px!important;display:flex;align-items:center;flex-wrap:wrap;gap:2px}
#mana .percentage{width:48px;height:16px}
#mana i{width:100%;height:4px;margin:0}
#tag{padding:2px!important;display:flex;gap:2px}
#connection,#mode{width:36px;height:36px}
#live{width:44px;height:44px}
#help{position:fixed;right:8px;top:8px}
#camp,#chron{left:auto!important;right:8px;top:64px!important;bottom:calc(var(--hud-height) + 8px)!important;width:min(360px,calc(100vw - 16px))!important;height:auto!important;max-height:none!important;overflow:auto!important;display:block}
.drawer-close{position:sticky;top:0;float:right;z-index:1}
#camps,#feed{padding:8px;clear:both;overflow:auto!important}
.bitmap-row{position:relative;width:100%;padding:2px 0;overflow:hidden}
.bitmap-row canvas{max-width:none}
.pips{display:flex;gap:3px}
.pips canvas{width:36px;height:36px}
#quest{width:min(440px,calc(100vw - 32px))!important;max-height:calc(100vh - 32px);overflow:auto;display:block!important;padding:8px!important}
#quest[hidden]{display:none!important}
#quest{background:#0d1423}
#quest .close{position:sticky;top:0;float:right;z-index:1;margin:0}
.detail-content{clear:both}
.legend-row{display:flex;align-items:flex-start;gap:8px}.legend-row>canvas{flex:none}.legend-row .bitmap-row{min-width:0;flex:1}
@media(max-width:760px) and (orientation:portrait){
  #hud{height:132px!important;display:grid!important;grid-template-columns:44px 60px 1fr 44px 44px;grid-template-rows:44px 24px 44px;gap:4px!important}
  #play{grid-column:1;grid-row:1}#speeds{grid-column:2;grid-row:1}#clock{grid-column:3;grid-row:1}#world{grid-column:4;grid-row:1}#calm{grid-column:5;grid-row:1}
  #scrub{grid-column:1/-1;grid-row:2;width:100%;margin:0}#mana{grid-column:1/4;grid-row:3}#tabs{grid-column:4/6;grid-row:3}
  #mana>div{width:58px!important;flex-direction:column;justify-content:center;gap:1px}#mana .percentage{width:48px}
}
@media(max-height:500px) and (orientation:landscape){
  #hud{height:56px!important;justify-content:center}
  #clock{position:fixed;left:132px;top:20px}
  #mana>div{width:40px!important}#mana .percentage{display:none}
  #scrub{position:fixed;left:204px;right:64px;top:12px;width:calc(100vw - 268px);margin:0}
}
@media(min-width:761px){#hud #tabs{display:flex!important}}

.panel{position:fixed;background:var(--panel);border:1px solid var(--gold);border-radius:6px;box-shadow:0 4px 18px #0008}
#hud{display:flex;align-items:center}
#scrub{accent-color:var(--gold)}
.mana{display:flex}.mana i{display:block;background:#22304f;overflow:hidden}.mana b{display:block;height:100%}
#quest{left:50%;top:50%;transform:translate(-50%,-50%)}
#tag{left:8px;top:8px}

</style>
</head>
<body>
<canvas id="stage" aria-label="โลก Hermes Quest"></canvas>
<canvas id="ui-stage" aria-hidden="true"></canvas>
<div id="tag" class="panel"><span id="mode" role="img"></span><span id="connection" role="status"></span><button id="live" hidden aria-label="ติดตามสด"></button></div>
<button id="help" aria-label="คำอธิบายไอคอน"></button>
<div id="camp" class="panel" hidden aria-label="งาน"><button id="camp-close" class="drawer-close" aria-label="ปิด"></button><div id="camps"></div></div>
<div id="chron" class="panel" hidden aria-label="บันทึก"><button id="chron-close" class="drawer-close" aria-label="ปิด"></button><div id="feed"></div></div>
<div id="quest" class="panel" role="dialog" aria-label="รายละเอียด" hidden></div>
<div id="hud" class="panel">
  <button id="play" aria-label="เล่นหรือหยุด"></button>
  <button id="speeds" aria-label="ความเร็ว replay"></button>
  <span id="clock" role="timer"></span>
  <input id="scrub" aria-label="เวลา replay" type="range" min="0" max="1000" value="0">
  <div class="mana" id="mana"></div>
  <span id="tabs"><button id="quests" data-t="camp" aria-label="งาน"></button><button id="log" data-t="chron" aria-label="บันทึก"></button></span>
  <button id="world" aria-label="แผนที่"></button>
  <button id="calm" aria-label="ลดการสั่นและแสงกะพริบ"></button>
</div>
<script src="font.js"></script>
<script src="ui-glyphs.js"></script>
<script src="ui-panels.js"></script>
<script src="npcs.js"></script>
<script src="game.js"></script>
</body>
</html>
