<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Quest</title>
<style>
:root{--ink:#e8dfc6;--gold:#d9b25c;--navy:#0d1526;--panel:#111b30ee;--line:#3a4a6b;--red:#e0503c;--green:#58c27a;--blue:#4aa3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05080f;color:var(--ink);font:13px/1.35 "Noto Sans Thai",system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
.panel{position:fixed;background:var(--panel);border:1px solid var(--gold);border-radius:6px;box-shadow:0 4px 18px #0008}
.panel h3{margin:0;padding:6px 10px;font-size:13px;color:var(--gold);letter-spacing:.06em;border-bottom:1px solid var(--line)}
#hud{left:8px;right:8px;bottom:8px;display:flex;gap:10px;align-items:center;padding:6px 10px;flex-wrap:wrap}
#hud button{background:#1b2742;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 9px;font:inherit;cursor:pointer}
#hud button.on{border-color:var(--gold);color:var(--gold)}
#scrub{flex:1;min-width:140px;accent-color:var(--gold)}
#clock{font:600 15px ui-monospace,monospace;color:var(--gold);min-width:88px}
.mana{display:flex;gap:8px}
.mana div{width:62px;font-size:11px;text-align:center}
.mana i{display:block;height:6px;border-radius:3px;background:#22304f;overflow:hidden;margin-top:2px}
.mana b{display:block;height:100%}
#camp{right:8px;top:8px;width:310px;max-height:44vh;overflow:auto}
#chron{right:8px;top:calc(44vh + 16px);width:310px;bottom:74px;overflow:hidden;display:flex;flex-direction:column}
#chron ul{list-style:none;margin:0;padding:4px 10px;overflow:hidden;flex:1}
#chron li{padding:2px 0;border-bottom:1px dashed #2a3858;font-size:12px}
#chron li time{color:#8aa0c8;font:11px ui-monospace,monospace;margin-right:6px}
.c{padding:6px 10px;border-bottom:1px solid var(--line)}
.c b{color:var(--ink)} .pips{display:flex;gap:3px;margin:4px 0}
.pips span{flex:1;font-size:9px;text-align:center;padding:2px 0;border-radius:3px;background:#1b2742;color:#7f8fb0}
.pips .done{background:#5c4a1c;color:var(--gold)} .pips .active{background:#1f4c7a;color:#cfe6ff;box-shadow:0 0 6px var(--blue)}
.bar{height:5px;background:#22304f;border-radius:3px;overflow:hidden}.bar b{display:block;height:100%;background:var(--gold)}
.blk{color:var(--red);font-size:11px}
#quest{left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);display:none;padding-bottom:8px}
#quest .row{padding:4px 12px} #quest .k{color:#8aa0c8;font-size:11px}
#quest .badge{display:inline-block;border:1px solid var(--gold);border-radius:3px;padding:0 5px;margin-right:4px;font-size:11px;color:var(--gold)}
#quest button{margin:8px 12px 0;background:#1b2742;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 12px;font:inherit}
#tag{left:8px;top:8px;padding:5px 10px;font-size:12px}
#tag b{color:var(--gold)}
#connection{display:block;font-size:11px;color:var(--green)}
#connection[data-state="offline"],#connection[data-state="snapshot"]{color:var(--gold)}
@media (max-width:760px){
  #camp{left:8px;right:8px;width:auto;top:44px;max-height:30vh;display:none}
  #chron{left:8px;right:8px;width:auto;top:auto;bottom:118px;height:26vh;display:none}
  body.show-camp #camp,body.show-chron #chron{display:flex;flex-direction:column}
  .mana div{width:48px}
  #hud{gap:6px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
  #hud button{min-height:36px}
  #scrub{flex-basis:100%;order:2;min-height:24px}
  .mana{order:3} #tabs{order:3}
  #tag{max-width:calc(100vw - 16px)}
  #camp{top:66px} #chron{bottom:164px}
}
@media (min-width:761px){#tabs{display:none}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="tag" class="panel"><b>HERMES QUEST</b> <span id="mode"></span><span id="connection" role="status">กำลังโหลด…</span></div>
<div id="camp" class="panel"><h3>CAMPAIGNS · งานทั้งชุด</h3><div id="camps"></div></div>
<div id="chron" class="panel"><h3>CHRONICLE · บันทึกของ Captain</h3><ul id="feed"></ul></div>
<div id="quest" class="panel"></div>
<div id="hud" class="panel">
  <button id="play">⏸</button>
  <button id="live" hidden>LIVE</button>
  <span id="speeds"></span>
  <span id="clock">--:--</span>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <div class="mana" id="mana"></div>
  <span id="tabs"><button data-t="camp">งาน</button> <button data-t="chron">บันทึก</button></span>
  <button id="world">🌍 โลก</button>
  <button id="calm" title="ลดการสั่นและแสงกะพริบ">ลดเอฟเฟกต์</button>
</div>
<script src="npcs.js"></script>
<script src="game.js"></script>
</body>
</html>
